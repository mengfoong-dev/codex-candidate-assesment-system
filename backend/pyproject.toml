[project]
name = "vibeproof-backend"
version = "1.0.0"
description = "VibeProof Incident Room backend — FastAPI, three-layer scoring, no auth (hackathon MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cohere>=5.20",             # Simulation Engine + primary grading panel
    "openai>=1.40",             # Grading panel — Groq + NVIDIA NIM via base-URL swap
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",              # ASGI transport for endpoint tests
]

# Run everything from backend/: `uvicorn src.main:app --reload` and `pytest`.
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
